<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us – AITSUN AI</title>
  <style>
    :root {
      --bg-color: #0a0a1a; /* dark navy */
      --text-color: #ffffff;
      --accent-color: #6c63ff; /* purple accent */
      --input-bg: #1e1e2f;
      --input-border: #33334d;
    }
    body {
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
    }
    .container {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      padding: 2rem;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    }
    h1 {
      text-align: center;
      margin-bottom: 1.5rem;
      font-weight: 600;
    }
    label {
      display: block;
      margin-top: 1rem;
      font-size: 0.9rem;
    }
    input, select, textarea {
      width: 100%;
      padding: 0.75rem;
      margin-top: 0.25rem;
      border: 1px solid var(--input-border);
      border-radius: 8px;
      background: var(--input-bg);
      color: var(--text-color);
      font-size: 1rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent-color);
      box-shadow: 0 0 0 2px rgba(108,99,255,0.3);
    }
    button {
      margin-top: 1.5rem;
      width: 100%;
      padding: 0.85rem;
      border: none;
      border-radius: 8px;
      background: var(--accent-color);
      color: #fff;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    button:hover:not(:disabled) {
      background: #5a53e0;
    }
    button:active:not(:disabled) {
      transform: scale(0.98);
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .spinner {
      border: 3px solid rgba(255,255,255,0.2);
      border-top: 3px solid #fff;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      animation: spin 0.8s linear infinite;
      display: inline-block;
      vertical-align: middle;
      margin-right: 0.5rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status-message {
      margin-top: 1rem;
      text-align: center;
      font-weight: 500;
    }
    @media (max-width: 600px) {
      .container { padding: 1.5rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Enquiry Form</h1>
    <form id="enquiryForm" novalidate>
      <label for="name">Your full name *</label>
      <input type="text" id="name" name="name" required placeholder="John Doe" />

      <label for="email">Work email *</label>
      <input type="email" id="email" name="email" required placeholder="john@company.com" />

      <label for="phone">Phone number</label>
      <input type="tel" id="phone" name="phone" placeholder="+1 555 1234" />

      <label for="company">Company name</label>
      <input type="text" id="company" name="company" placeholder="Acme Corp" />

      <label for="service_interest">I’m interested in *</label>
      <select id="service_interest" name="service_interest" required>
        <option value="" disabled selected>Select a service</option>
        <option value="AI Automation">AI Automation</option>
        <option value="AI Chatbot">AI Chatbot</option>
        <option value="ERP / Odoo Implementation">ERP / Odoo Implementation</option>
        <option value="Custom AI Development">Custom AI Development</option>
        <option value="Consulting">Consulting</option>
        <option value="Other">Other</option>
      </select>

      <label for="message">Brief message</label>
      <textarea id="message" name="message" rows="4" placeholder="Tell us a bit about your needs..."></textarea>

      <button type="submit" id="submitBtn">Submit</button>
      <div class="status-message" id="statusMsg" role="alert" aria-live="polite"></div>
    </form>
  </div>

  <script>
    const form = document.getElementById('enquiryForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusMsg = document.getElementById('statusMsg');

    const webhookUrl = 'https://n8n.aitsun.space/webhook/aitsun-enquiry';

    function setLoading(isLoading) {
      if (isLoading) {
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner"></span>Sending…';
      } else {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Submit';
      }
    }

    function showMessage(text, isError = false) {
      statusMsg.textContent = text;
      statusMsg.style.color = isError ? '#ff6b6b' : '#6CFF6C';
    }

    function validateEmail(email) {
      const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      return re.test(email);
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      statusMsg.textContent = '';

      const name = form.name.value.trim();
      const email = form.email.value.trim();
      const phone = form.phone.value.trim();
      const company = form.company.value.trim();
      const service = form.service_interest.value;
      const message = form.message.value.trim();

      if (!name || !email || !service) {
        showMessage('Please fill in all required fields.', true);
        return;
      }

      if (!validateEmail(email)) {
        showMessage('Please enter a valid email address.', true);
        return;
      }

      const payload = { name, email, phone, company, service_interest: service, message };

      try {
        setLoading(true);
        const response = await fetch(webhookUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });

        const result = await response.json();
        if (response.ok && result.status === 'success') {
          showMessage('✅ Thank you! Our team will reach out within 24 hours.', false);
          form.reset();
        } else {
          throw new Error('Unexpected response');
        }
      } catch (err) {
        console.error(err);
        showMessage('❌ Something went wrong. Please try again or email us at hello@aitsun.ai', true);
      } finally {
        setLoading(false);
      }
    });
  </script>
</body>
</html>
