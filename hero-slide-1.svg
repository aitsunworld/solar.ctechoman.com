<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3a8dcc;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:0.1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background subtle circle -->
  <circle cx="250" cy="250" r="180" fill="url(#grad1)" />
  
  <!-- Tree/eco lightbulb -->
  <g transform="translate(150,180)">
    <!-- Tree trunk -->
    <rect x="100" y="120" width="20" height="80" rx="10" fill="#444444" />
    
    <!-- Leaves -->
    <circle cx="110" cy="110" r="50" fill="#10b981" opacity="0.8" />
    <circle cx="70" cy="100" r="40" fill="#10b981" opacity="0.6" />
    <circle cx="150" cy="100" r="40" fill="#10b981" opacity="0.6" />
    <circle cx="110" cy="70" r="35" fill="#34d399" opacity="0.7" />
    
    <!-- Lightbulb -->
    <path d="M95 150 c0 -25 15 -45 40 -45 s40 20 40 45 c0 22 -18 40 -40 40 s-40 -18 -40 -40z" 
          fill="#fbbf24" stroke="#f59e0b" stroke-width="3" filter="url(#glow)" />
    <line x1="115" y1="150" x2="115" y2="190" stroke="#f59e0b" stroke-width="4" />
    
    <!-- Sun rays -->
    <g stroke="#fbbf24" stroke-width="3">
      <line x1="115" y1="45" x2="115" y2="30" />
      <line x1="85" y1="55" x2="70" y2="40" />
      <line x1="145" y1="55" x2="160" y2="40" />
      <line x1="75" y1="85" x2="55" y2="70" />
      <line x1="155" y1="85" x2="175" y2="70" />
    </g>
  </g>
</svg>