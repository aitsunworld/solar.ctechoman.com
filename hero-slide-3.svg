<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3a8dcc;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:0.7" />
    </linearGradient>
    <linearGradient id="batteryGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#34d399;stop-opacity:0.6" />
    </linearGradient>
    <linearGradient id="inverterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:0.6" />
    </linearGradient>
  </defs>
  
  <!-- Solar panel grid layout -->
  <g transform="translate(80,120)">
    <!-- Multiple solar panels -->
    <rect x="0" y="0" width="140" height="100" rx="4" fill="url(#panelGrad)" />
    <rect x="160" y="0" width="140" height="100" rx="4" fill="url(#panelGrad)" />
    <rect x="0" y="120" width="140" height="100" rx="4" fill="url(#panelGrad)" />
    <rect x="160" y="120" width="140" height="100" rx="4" fill="url(#panelGrad)" />
    
    <!-- Panel grid lines -->
    <g stroke="#ffffff" stroke-width="1" opacity="0.3">
      <line x1="40" y1="0" x2="40" y2="100" />
      <line x1="80" y1="0" x2="80" y2="100" />
      <line x1="0" y1="30" x2="140" y2="30" />
      <line x1="0" y1="60" x2="140" y2="60" />
      <line x1="200" y1="30" x2="340" y2="30" />
      <line x1="200" y1="60" x2="340" y2="60" />
      <line x1="40" y1="120" x2="40" y2="220" />
      <line x1="80" y1="120" x2="80" y2="220" />
      <line x1="200" y1="120" x2="200" y2="220" />
      <line x1="240" y1="120" x2="240" y2="220" />
    </g>
  </g>
  
  <!-- Battery storage -->
  <g transform="translate(340,180)">
    <rect x="0" y="0" width="80" height="200" rx="12" fill="url(#batteryGrad)" />
    <rect x="0" y="0" width="20" height="40" rx="4" fill="#059669" />
    <text x="40" y="110" font-family="Outfit,Arial" font-size="24" fill="#ffffff" font-weight="700" text-anchor="middle">B</text>
    <rect x="0" y="180" width="80" height="20" rx="4" fill="#047857" />
  </g>
  
  <!-- Inverter -->
  <g transform="translate(100,340)">
    <rect x="0" y="0" width="100" height="80" rx="8" fill="url(#inverterGrad)" />
    <text x="50" y="50" font-family="Outfit,Arial" font-size="14" fill="#ffffff" font-weight="700" text-anchor="middle" letter-spacing="2">INVERTER</text>
  </g>
  
  <!-- Sun with rays -->
  <g transform="translate(380,60)">
    <circle cx="0" cy="0" r="40" fill="#fbbf24" opacity="0.9" />
    <g stroke="#fbbf24" stroke-width="4">
      <line x1="0" y1="-55" x2="0" y2="-65" />
      <line x1="0" y1="65" x2="0" y2="55" />
      <line x1="-55" y1="0" x2="-65" y2="0" />
      <line x1="65" y1="0" x2="55" y2="0" />
      <line x1="-40" y1="-40" x2="-48" y2="-48" />
      <line x1="48" y1="48" x2="40" y2="40" />
      <line x1="-40" y1="40" x2="-48" y2="48" />
      <line x1="48" y1="-48" x2="40" y2="-40" />
    </g>
  </g>
</svg>